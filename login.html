<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SheShield - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            width: 400px;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            color: #6b46c1;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .heading {
            text-align: center;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #6b46c1;
        }

        .login-btn {
            width: 100%;
            background: #6b46c1;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #5936a7;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: red;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #6b46c1;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1 class="logo">SheShield</h1>

        <h2 class="heading">Login</h2>

        <p class="subtitle">
            Welcome back! Stay safe with SheShield.
        </p>

        <div class="input-group">
            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >
        </div>

        <div class="input-group">
            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >
        </div>

        <button class="login-btn" onclick="login()">
            Login
        </button>

        <p id="message"></p>

        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>


    <script>

        function login() {

            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            if (email === "" || password === "") {

                document.getElementById("message").innerText =
                    "Please enter email and password.";

                return;
            }

            document.getElementById("message").style.color = "green";

            document.getElementById("message").innerText =
                "Login successful!";

            setTimeout(function() {

                window.location.href = "index.html";

            }, 1000);
        }

    </script>

</body>

</html>
